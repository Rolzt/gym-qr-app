<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker V2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>🏋️ Gym Tracker</h1>
    </header>

    <!-- LOGIN -->

    <section id="loginSection">

        <h2>Log ind</h2>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Adgangskode">

        <button id="loginButton">
            Log ind
        </button>

        <button id="signupButton">
            Opret bruger
        </button>

        <button id="forgotPasswordButton">
            Glemt adgangskode
        </button>

    </section>


    <!-- PASSWORD RESET -->

    <section id="passwordResetSection" class="hidden">

        <h2>Ny adgangskode</h2>

        <input
            type="password"
            id="newPassword"
            placeholder="Ny adgangskode">

        <button id="savePasswordButton">
            Gem ny adgangskode
        </button>

    </section>


    <!-- LOGGET IND -->

    <section id="accountSection" class="hidden">

        <h2>Min konto</h2>

        <p>

            Logget ind som

            <strong id="userEmail"></strong>

        </p>

        <button id="logoutButton">

            Log ud

        </button>

    </section>


    <!-- ØVELSE -->

    <section id="workoutSection" class="hidden">

        <h2 id="exerciseName">
            Øvelse
        </h2>

        <div class="card">

            <h3>Sidste træning</h3>

            <div id="lastWorkout">

                Ingen tidligere træning.

            </div>

        </div>


        <div class="card">

            <h3>Progression</h3>

            <div id="progress">

                Ingen data endnu.

            </div>

        </div>


        <div class="card">

            <h3>Nyt sæt</h3>

            <input
                type="number"
                id="weight"
                placeholder="Kg">

            <input
                type="number"
                id="reps"
                placeholder="Reps">

            <button id="saveSetButton">

                Gem sæt

            </button>

        </div>


        <div class="card">

            <h3>Dagens sæt</h3>

            <div id="setsList">

            </div>

        </div>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>
</html>
